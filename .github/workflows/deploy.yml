name: Deploy to Firebase Hosting

# Every merge/push to main builds the app and deploys it live, so "merged" means
# "on your phone". Requires one repo secret: FIREBASE_SERVICE_ACCOUNT — a Firebase
# service-account JSON key with the Firebase Hosting Admin role. See README/PR notes.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Core (pure-logic) tests + the app tests must pass before anything ships.
      - name: Install core deps
        run: npm ci
      - name: Test core
        run: npm test

      - name: Install app deps
        run: npm --prefix app ci
      - name: Test app
        run: npm --prefix app test

      # Fail loudly if the web config is absent, rather than shipping a bundle whose
      # sign-in says "cloud not configured" while the deploy reports success.
      - name: Verify Firebase web config is present
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          missing=""
          [ -z "$VITE_FIREBASE_API_KEY" ] && missing="$missing VITE_FIREBASE_API_KEY"
          [ -z "$VITE_FIREBASE_APP_ID" ] && missing="$missing VITE_FIREBASE_APP_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing Firebase web config repo Variable(s):$missing — add them under Settings → Secrets and variables → Actions → Variables, or sign-in ships as 'cloud not configured'."
            exit 1
          fi
          echo "Firebase web config present."

      # Produce app/dist, which firebase.json serves as the hosting root.
      # Vite inlines VITE_* at build time. The Firebase *web* config is NOT secret (it
      # only identifies the project; real protection is Firestore rules + Auth), so the
      # public identifiers are inline here and the rest come from repo Variables. Without
      # these the build ships with no cloud and sign-in says "cloud not configured".
      - name: Build app
        run: npm --prefix app run build
        env:
          VITE_FIREBASE_PROJECT_ID: u-track-prod
          VITE_FIREBASE_AUTH_DOMAIN: u-track-prod.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: u-track-prod.appspot.com
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: u-track-prod
          channelId: live
